<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a" />
      <stop offset="50%" stop-color="#0a0b10" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>

    <!-- Neon Accents Gradients -->
    <linearGradient id="bluePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    /* Typography & Animations */
    .title-name {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -1.5px;
    }
    
    .role-label {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 1px;
    }

    .cursor {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #3b82f6;
      animation: blink 0.8s infinite;
    }

    /* Role Text Fade Animations */
    .role-text {
      font-family: 'Consolas', 'Fira Code', Monaco, monospace;
      font-size: 20px;
      font-weight: 700;
      opacity: 0;
    }

    .role1 { animation: cycleText1 16s infinite; fill: #3b82f6; }
    .role2 { animation: cycleText2 16s infinite; fill: #a855f7; }
    .role3 { animation: cycleText3 16s infinite; fill: #ec4899; }
    .role4 { animation: cycleText4 16s infinite; fill: #10b981; }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    @keyframes cycleText1 {
      0%, 22% { opacity: 1; transform: translate(195px, 175px); }
      23%, 100% { opacity: 0; transform: translate(195px, 185px); }
    }
    @keyframes cycleText2 {
      0%, 23% { opacity: 0; transform: translate(195px, 165px); }
      25%, 47% { opacity: 1; transform: translate(195px, 175px); }
      48%, 100% { opacity: 0; transform: translate(195px, 185px); }
    }
    @keyframes cycleText3 {
      0%, 48% { opacity: 0; transform: translate(195px, 165px); }
      50%, 72% { opacity: 1; transform: translate(195px, 175px); }
      73%, 100% { opacity: 0; transform: translate(195px, 185px); }
    }
    @keyframes cycleText4 {
      0%, 73% { opacity: 0; transform: translate(195px, 165px); }
      75%, 97% { opacity: 1; transform: translate(195px, 175px); }
      98%, 100% { opacity: 0; transform: translate(195px, 185px); }
    }

    /* Abstract Cyber Graphic float */
    .cyber-shape {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
  </style>

  <!-- 1. Background Fill -->
  <rect width="800" height="280" fill="url(#bgGrad)" />

  <!-- 2. Ambient Glow Overlays -->
  <rect width="800" height="280" fill="url(#glow)" />
  <rect width="800" height="280" fill="url(#blueGlow)" />

  <!-- 3. Tech Grid Overlay -->
  <rect width="800" height="280" fill="url(#grid)" />

  <!-- 4. Decorative Cyberpunk Elements (Right Side) -->
  <g class="cyber-shape" transform="translate(560, 40)">
    <!-- Circuit rings -->
    <circle cx="90" cy="100" r="80" fill="none" stroke="url(#bluePurple)" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="90" cy="100" r="50" fill="none" stroke="url(#bluePurple)" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="10 8" />
    <circle cx="90" cy="100" r="25" fill="none" stroke="url(#bluePurple)" stroke-opacity="0.4" stroke-width="1.5" />
    
    <!-- Central Glowing Core -->
    <circle cx="90" cy="100" r="8" fill="#3b82f6" filter="drop-shadow(0 0 10px #3b82f6)" />
    
    <!-- Crosshairs -->
    <path d="M 90 10 L 90 40 M 90 160 L 90 190 M 0 100 L 30 100 M 150 100 L 180 100" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Cyber Hexagon outline -->
    <polygon points="90,30 150,65 150,135 90,170 30,135 30,65" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="2" />
  </g>

  <!-- 5. Left Text Header Info -->
  <g transform="translate(60, 0)">
    <!-- Tech Tag -->
    <rect y="60" width="105" height="24" rx="12" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-opacity="0.2" />
    <text x="12" y="76" font-family="'Consolas', Monaco, monospace" font-size="11" font-weight="bold" fill="#3b82f6">SYSTEM.INIT</text>

    <!-- Name Header -->
    <text y="130" class="title-name">Fuad Hiyabo</text>

    <!-- Subtitle (Animated Typing Cycling Roles) -->
    <text y="175" class="role-label">&gt;_ </text>
    
    <!-- Animate roles in place -->
    <text class="role-text role1">Data Analyst</text>
    <text class="role-text role2">Web Developer</text>
    <text class="role-text role3">AI Enthusiast</text>
    <text class="role-text role4">Open To Work</text>

    <!-- Blinking console cursor -->
    <text x="365" y="175" class="cursor">|</text>
  </g>

  <!-- 6. Bottom Border Tech Accent -->
  <rect y="277" width="800" height="3" fill="url(#bluePurple)" />
</svg>
