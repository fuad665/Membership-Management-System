<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280">
  <defs>
    <!-- Calm Soft Slate & Indigo-Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Soothing Blue to Mint Gradient -->
    <linearGradient id="soothingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    
    <radialGradient id="softGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="mintGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Fine Tech Grid -->
    <pattern id="fineGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.8" />
    </pattern>

    <!-- Typing Mask Animation for Name "Fuad Hiyabo" (approx 280px wide) -->
    <clipPath id="typingNameClip">
      <rect x="58" y="80" height="60" width="0">
        <animate 
          attributeName="width" 
          from="0" 
          to="280" 
          dur="2.5s" 
          begin="0.5s" 
          fill="freeze" 
          keyTimes="0;1" 
          keySplines="0.25 0.1 0.25 1" 
          calcMode="spline" 
        />
      </rect>
    </clipPath>
  </defs>

  <style>
    .title-name {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    
    .role-label {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #64748b;
      letter-spacing: 0.5px;
    }

    /* Role Cycling Text Animation */
    .role-text {
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: 18px;
      font-weight: 600;
      opacity: 0;
    }

    .role1 { animation: cycle1 16s infinite; fill: #60a5fa; }
    .role2 { animation: cycle2 16s infinite; fill: #34d399; }
    .role3 { animation: cycle3 16s infinite; fill: #a78bfa; }
    .role4 { animation: cycle4 16s infinite; fill: #94a3b8; }

    @keyframes cycle1 {
      0%, 22% { opacity: 1; transform: translate(195px, 175px); }
      23%, 100% { opacity: 0; transform: translate(195px, 185px); }
    }
    @keyframes cycle2 {
      0%, 23% { opacity: 0; transform: translate(195px, 165px); }
      25%, 47% { opacity: 1; transform: translate(195px, 175px); }
      48%, 100% { opacity: 0; transform: translate(195px, 185px); }
    }
    @keyframes cycle3 {
      0%, 48% { opacity: 0; transform: translate(195px, 165px); }
      50%, 72% { opacity: 1; transform: translate(195px, 175px); }
      73%, 100% { opacity: 0; transform: translate(195px, 185px); }
    }
    @keyframes cycle4 {
      0%, 73% { opacity: 0; transform: translate(195px, 165px); }
      75%, 97% { opacity: 1; transform: translate(195px, 175px); }
      98%, 100% { opacity: 0; transform: translate(195px, 185px); }
    }

    .pulse-dot {
      animation: pulse 3s infinite;
    }
    @keyframes pulse {
      0%, 100% { fill-opacity: 0.3; }
      50% { fill-opacity: 0.8; }
    }
  </style>

  <!-- 1. Background -->
  <rect width="800" height="280" fill="url(#bgGrad)" />

  <!-- 2. Ambient Glow Overlays -->
  <rect width="800" height="280" fill="url(#softGlow)" />
  <rect width="800" height="280" fill="url(#mintGlow)" />

  <!-- 3. Tech Grid Overlay -->
  <rect width="800" height="280" fill="url(#fineGrid)" />

  <!-- 4. Clean Tech Drawing (Right Side) -->
  <g transform="translate(560, 40)" stroke-linecap="round">
    <!-- Concentric circles -->
    <circle cx="90" cy="100" r="70" fill="none" stroke="#60a5fa" stroke-opacity="0.08" stroke-width="1.5" />
    <circle cx="90" cy="100" r="45" fill="none" stroke="#34d399" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="6 6" />
    
    <!-- Central pulsing dot -->
    <circle cx="90" cy="100" r="5" fill="#34d399" class="pulse-dot" />
    
    <!-- Design Lines -->
    <line x1="90" y1="15" x2="90" y2="35" stroke="#64748b" stroke-opacity="0.2" stroke-width="1" />
    <line x1="90" y1="165" x2="90" y2="185" stroke="#64748b" stroke-opacity="0.2" stroke-width="1" />
    <line x1="5" y1="100" x2="25" y2="100" stroke="#64748b" stroke-opacity="0.2" stroke-width="1" />
    <line x1="155" y1="100" x2="175" y2="100" stroke="#64748b" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <!-- 5. Left Text Header Info -->
  <g transform="translate(60, 0)">
    <!-- System Tag -->
    <rect y="60" width="105" height="22" rx="11" fill="#60a5fa" fill-opacity="0.05" stroke="#60a5fa" stroke-opacity="0.15" />
    <text x="12" y="74" font-family="'Consolas', Monaco, monospace" font-size="10" font-weight="bold" fill="#60a5fa">PROFILE.ACTIVE</text>

    <!-- Typing Name using Clip Path Mask -->
    <text x="60" y="130" class="title-name" clip-path="url(#typingNameClip)">Fuad Hiyabo</text>

    <!-- Typing Cursor (translates to the right in sync with mask width) -->
    <rect y="98" width="2" height="36" fill="#60a5fa">
      <animate 
        attributeName="x" 
        from="60" 
        to="315" 
        dur="2.5s" 
        begin="0.5s" 
        fill="freeze" 
        keyTimes="0;1" 
        keySplines="0.25 0.1 0.25 1" 
        calcMode="spline" 
      />
      <animate 
        attributeName="opacity" 
        values="1;0;1" 
        dur="0.8s" 
        repeatCount="indefinite" 
      />
    </rect>

    <!-- Subtitle Roles Section -->
    <text y="175" class="role-label">&gt;_ </text>
    
    <!-- Animate roles in place -->
    <text class="role-text role1">Data Analyst</text>
    <text class="role-text role2">Web Developer</text>
    <text class="role-text role3">AI Enthusiast</text>
    <text class="role-text role4">Open To Work</text>

    <!-- Blinking console cursor for subtitle -->
    <text x="365" y="175" class="cursor" font-family="monospace">_</text>
  </g>

  <!-- 6. Bottom Border Tech Accent -->
  <rect y="278" width="800" height="2" fill="url(#soothingGrad)" />
</svg>
